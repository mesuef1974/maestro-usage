name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest  # الجدولة والحارس يستعملان أوامر ويندوز؛ الاختبارات تمرّ على لينكس أيضًا لكن المرجع هو ويندوز
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet ruff pytest
      - run: ruff check .
      - run: python -m pytest -q tests
  lint-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet ruff pytest
      - run: ruff check .
      - run: python -m pytest -q tests
