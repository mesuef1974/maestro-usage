# فحص الكود في CI وقبل الدفع: أخطاء حقيقية فقط (E/F/W) بلا فرض تنسيق على الأسطر الطويلة؛ الأسطر هنا طويلة عمدًا بالتعليقات العربية
line-length = 160
target-version = "py312"

[lint]
select = ["E", "F", "W", "B006", "B007"]
ignore = ["E501", "E701", "E702"]  # الأسطر المضغوطة بالفواصل المنقوطة أسلوب مقصود في هذا المستودع

[lint.per-file-ignores]
"tests/*" = ["E402"]
"src/*" = ["E402"]
"scripts/*" = ["E402", "E731", "B007", "F841"]  # نصوص تحليل لمرة واحدة
