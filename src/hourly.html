<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>التوكنات بالساعة</title>
</head>
<body>
__SHELL_OPEN__
<!--@sec ht--><section class="card" aria-labelledby="hrht">
  <div class="cardhead"><h2 id="hrht">التوكنات بالساعة</h2><span class="sub" id="hsum"></span></div>
  <div class="ctl">
    <div class="seg" id="hrange" role="group" aria-label="المدّة"><button type="button" data-v="2">يومان</button><button type="button" data-v="7">7 أيام</button><button type="button" data-v="30">30 يومًا</button></div>
    <div class="seg" id="hmode" role="group" aria-label="نوع المنحنى"><button type="button" data-v="cum">تراكمي</button><button type="button" data-v="per">لكل ساعة</button></div>
  </div>
  <div class="chart" id="hchart"></div>
</section><!--@/sec-->

__SHELL_CLOSE__
<div id="tip" role="status" aria-live="off"></div>
<script type="application/json" id="data">__DATA__</script>
<script>
"use strict";
(function(){
var D=JSON.parse(document.getElementById("data").textContent);
__LIB__
var H1=36e5,S={range:"7",mode:"cum"},ROWS=D.h;
function seg(id,key){
  var box=$(id);
  [].forEach.call(box.children,function(b){
    b.setAttribute("aria-pressed",String(b.dataset.v===S[key]));
    b.addEventListener("click",function(){S[key]=b.dataset.v;draw()});
  });
}
function sync(id,key){[].forEach.call($(id).children,function(b){b.setAttribute("aria-pressed",String(b.dataset.v===S[key]))})}
function draw(){
  sync("#hrange","range");sync("#hmode","mode");
  var box=$("#hchart");
  if(!ROWS.length){clear(box);box.appendChild(mk("div",{class:"empty"},"لا ردود مسجّلة بعد."));$("#hsum").textContent="";return}
  var last=ROWS[ROWS.length-1][0],from=last-Number(S.range)*24+1,pts=ROWS.filter(function(r){return r[0]>=from});
  var xs=[],vs=[],acc=0;
  pts.forEach(function(r){acc+=r[1];xs.push(r[0]*H1);vs.push(S.mode==="cum"?acc:r[1])});
  var ymax=niceMax(Math.max.apply(null,vs.concat([1])));
  $("#hsum").textContent=num(acc)+" توكن في "+num(pts.length)+" ساعة نشطة";
  var stamp=function(ms){return new Date(ms+3*H1).toISOString().slice(0,16).replace("T"," ")};  /* الدوحة = UTC+3 */
  drawLines(box,{label:"التوكنات بالساعة",xs:xs,x0:xs[0],x1:xs[xs.length-1],ymax:ymax,ml:58,gap:6*H1,
    yfmt:function(v){return compact(v,1)},xfmt:function(ms){return stamp(ms).slice(5,13)+"س"},tfmt:function(v){return num(v)},title:function(i){return stamp(xs[i])+" (الدوحة)"},
    series:[{name:S.mode==="cum"?"تراكمي":"لكل ساعة",c:"--s1",v:vs}]});
}
seg("#hrange","range");seg("#hmode","mode");
var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(draw,120)});
draw();
})();
</script>
</body>
</html>
